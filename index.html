<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para você 💜</title>

<style>

/* =========================
   CONFIGURAÇÕES
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    background:#100018;

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x:hidden;

}


/* =========================
   ABERTURA
========================= */

#inicio{

    min-height:100vh;

    position:relative;

    overflow:hidden;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(139,57,173,.35),
            transparent 30%
        ),

        radial-gradient(
            circle at 20% 20%,
            rgba(177,91,214,.18),
            transparent 25%
        ),

        linear-gradient(
            135deg,
            #100018,
            #260035,
            #100018
        );

}


/* =========================
   LUZES
========================= */

.luz{

    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    filter:blur(100px);

    opacity:.18;

    pointer-events:none;

}


.luz1{

    background:#b45de0;

    top:-180px;
    left:-150px;

}


.luz2{

    background:#71318d;

    right:-150px;
    bottom:-180px;

}


/* =========================
   PARTÍCULAS
========================= */

.particula{

    position:absolute;

    color:#d9a0ee;

    opacity:.35;

    animation:

        subir
        linear
        infinite;

}


.particula:nth-child(1){

    left:10%;
    bottom:-30px;

    animation-duration:9s;

    font-size:14px;

}


.particula:nth-child(2){

    left:25%;
    bottom:-30px;

    animation-duration:12s;

    animation-delay:2s;

    font-size:9px;

}


.particula:nth-child(3){

    left:45%;
    bottom:-30px;

    animation-duration:10s;

    animation-delay:4s;

    font-size:13px;

}


.particula:nth-child(4){

    left:70%;
    bottom:-30px;

    animation-duration:13s;

    animation-delay:1s;

    font-size:10px;

}


.particula:nth-child(5){

    left:88%;
    bottom:-30px;

    animation-duration:11s;

    animation-delay:3s;

    font-size:15px;

}


@keyframes subir{

    from{

        transform:
            translateY(0)
            scale(.7);

        opacity:0;

    }

    15%{

        opacity:.4;

    }

    80%{

        opacity:.3;

    }

    to{

        transform:
            translateY(-110vh)
            scale(1.2);

        opacity:0;

    }

}


/* =========================
   CONTEÚDO
========================= */

.conteudo{

    position:relative;

    z-index:5;

    max-width:700px;

    padding:30px;

}


.eyebrow{

    font-size:11px;

    letter-spacing:5px;

    text-transform:uppercase;

    color:#cfa1dc;

    margin-bottom:25px;

    opacity:0;

    animation:

        aparecer
        1.2s
        .3s
        forwards;

}


.titulo{

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(
            55px,
            14vw,
            105px
        );

    font-weight:normal;

    line-height:.95;

    letter-spacing:-3px;

    opacity:0;

    animation:

        aparecer
        1.3s
        .7s
        forwards;

}


.titulo span{

    display:block;

    color:#d795ed;

}


.frase{

    margin-top:30px;

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(
            17px,
            4vw,
            21px
        );

    line-height:1.7;

    color:#ded0e2;

    opacity:0;

    animation:

        aparecer
        1.3s
        1.2s
        forwards;

}


/* =========================
   CORAÇÃO
========================= */

.coracao{

    width:65px;

    height:65px;

    margin:35px auto 0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

    color:#e1a4f1;

    opacity:0;

    animation:

        aparecer
        1s
        1.7s
        forwards,

        pulsar
        2s
        2.7s
        infinite;

}


@keyframes pulsar{

    0%,100%{

        transform:scale(1);

    }

    50%{

        transform:scale(1.15);

    }

}


/* =========================
   BOTÃO
========================= */

#comecar{

    margin-top:30px;

    padding:16px 34px;

    border-radius:100px;

    border:

        1px solid
        rgba(
            255,
            255,
            255,
            .18
        );

    background:

        rgba(
            255,
            255,
            255,
            .07
        );

    color:white;

    font-size:14px;

    cursor:pointer;

    opacity:0;

    animation:

        aparecer
        1.2s
        2.2s
        forwards;

    transition:

        background .3s,
        transform .3s,
        box-shadow .3s;

}


#comecar:hover{

    background:

        rgba(
            170,
            85,
            210,
            .25
        );

    transform:
        translateY(-3px);

    box-shadow:

        0 10px 40px
        rgba(
            160,
            70,
            200,
            .2
        );

}


/* =========================
   ANIMAÇÃO DE SAÍDA
========================= */

#inicio.saindo{

    animation:

        desaparecer
        .9s
        forwards;

}


@keyframes desaparecer{

    to{

        opacity:0;

        transform:
            scale(1.04);

    }

}


@keyframes aparecer{

    from{

        opacity:0;

        transform:
            translateY(20px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =========================
   PRÓXIMA SEÇÃO
========================= */

#capitulo1{

    min-height:100vh;

    display:none;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:35px;

    background:

        radial-gradient(
            circle at center,
            #4d1763,
            #16001e 65%
        );

}


.capitulo-conteudo{

    max-width:650px;

}


.capitulo-conteudo small{

    display:block;

    color:#d59ae8;

    text-transform:uppercase;

    letter-spacing:4px;

    margin-bottom:20px;

}


.capitulo-conteudo h2{

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(
            40px,
            9vw,
            70px
        );

    font-weight:normal;

    margin-bottom:25px;

}


.capitulo-conteudo p{

    color:#d8c8dd;

    line-height:1.8;

    font-size:17px;

}


/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    .conteudo{

        padding:25px;

    }

    .titulo{

        letter-spacing:-2px;

    }

}

</style>

</head>


<body>


<!-- =========================
     ABERTURA
========================= -->

<section id="inicio">


    <div class="luz luz1"></div>

    <div class="luz luz2"></div>


    <!-- partículas -->

    <div class="particula">✦</div>

    <div class="particula">✧</div>

    <div class="particula">·</div>

    <div class="particula">✦</div>

    <div class="particula">✧</div>


    <div class="conteudo">


        <div class="eyebrow">

            uma pequena coisa para você

        </div>


        <h1 class="titulo">

            Para

            <span>você.</span>

        </h1>


        <p class="frase">

            Tem algumas coisas que eu queria
            te mostrar.

            <br>

            Coisas que talvez você nem imagine
            que eu tenha guardado.

        </p>


        <div class="coracao">

            ♡

        </div>


        <button id="comecar">

            quero ver →

        </button>


    </div>

</section>


<!-- =========================
     CAPÍTULO 1
========================= -->

<section id="capitulo1">

    <div class="capitulo-conteudo">


        <small>

            capítulo 1

        </small>


        <h2>

            Antes de continuar...

        </h2>


        <p>

            Eu queria que você soubesse
            uma coisa:

            <br><br>

            eu realmente presto atenção
            quando você fala.

        </p>


    </div>

</section>


<script>


const botao =
    document.getElementById("comecar");


const inicio =
    document.getElementById("inicio");


const capitulo1 =
    document.getElementById("capitulo1");


botao.addEventListener(
    "click",
    function(){

        inicio.classList.add("saindo");


        setTimeout(
            function(){

                inicio.style.display="none";

                capitulo1.style.display="flex";

                window.scrollTo({
                    top:0,
                    behavior:"instant"
                });

            },
            850
        );

    }
);


</script>

</body>

let audioAtual = null;

let botaoAtual = null;


const botoesMusica =
    musica.querySelectorAll(
        ".play-musica"
    );


botoesMusica.forEach(
    function(botao){

        botao.addEventListener(
            "click",
            function(){

                const arquivo =
                    botao.dataset.musica;


                /* Se clicou na música
                   que já está tocando */

                if(
                    audioAtual &&
                    botaoAtual === botao
                ){

                    if(
                        audioAtual.paused
                    ){

                        audioAtual.play();

                        botao.innerHTML =
                            "❚❚";

                        botao.classList.add(
                            "tocando"
                        );

                    }

                    else{

                        audioAtual.pause();

                        botao.innerHTML =
                            "▶";

                        botao.classList.remove(
                            "tocando"
                        );

                    }

                    return;

                }


                /* Para a música anterior */

                if(audioAtual){

                    audioAtual.pause();

                    audioAtual.currentTime =
                        0;

                }


                if(botaoAtual){

                    botaoAtual.innerHTML =
                        "▶";

                    botaoAtual.classList.remove(
                        "tocando"
                    );

                }


                /* Cria novo áudio */

                audioAtual =
                    new Audio(encodeURI(arquivo));


                botaoAtual =
                    botao;


                audioAtual.play();


                botao.innerHTML =
                    "❚❚";


                botao.classList.add(
                    "tocando"
                );


                /* Quando terminar */

                audioAtual.addEventListener(
                    "ended",
                    function(){

                        botao.innerHTML =
                            "▶";

                        botao.classList.remove(
                            "tocando"
                        );

                        audioAtual = null;

                        botaoAtual = null;

                    }
                );

            }
        );

    }
);
